name: Native Minimum OCTGN Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out Epic Battles Online
        uses: actions/checkout@v4

      - name: Check out the OCTGN revision used by the working Ranma build
        uses: actions/checkout@v4
        with:
          repository: octgn/OCTGN
          ref: 086a8f5a91d413dcce215af6af909cec998d34ce
          path: octgn-src
          submodules: recursive

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build native OCTGN packager
        shell: pwsh
        run: |
          nuget restore octgn-src/OCTGN.sln
          msbuild octgn-src/octgnFX/o8build/o8build.csproj /m /p:Configuration=Release /p:Platform=AnyCPU

      - name: Build Epic Battles image downloader
        shell: pwsh
        run: |
          msbuild octgn-src/octgnFX/Octgn.Core/Octgn.Core.csproj /m /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force octgn-refs | Out-Null
          foreach ($assembly in @('Octgn.Core.dll', 'Octgn.DataNew.dll')) {
            $source = Get-ChildItem octgn-src -Recurse -Filter $assembly | Where-Object { $_.FullName -match '\\bin\\Release\\' } | Select-Object -First 1
            if (-not $source) { throw "OCTGN build did not produce $assembly" }
            Copy-Item $source.FullName octgn-refs/
          }
          msbuild plugin/EpicBattlesImageDownloader/EpicBattlesImageDownloader.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:OCTGN_DIR="$env:GITHUB_WORKSPACE\octgn-refs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/Plugins/EpicBattlesImageDownloader | Out-Null
          Copy-Item plugin/EpicBattlesImageDownloader/bin/Release/EpicBattlesImageDownloader.dll dist/Plugins/EpicBattlesImageDownloader/

      - name: Validate with OCTGN
        shell: pwsh
        run: |
          $builder = Resolve-Path 'octgn-src/octgnFX/o8build/bin/Release/o8build.exe'
          $definition = (Resolve-Path 'dist').Path
          & $builder -d $definition -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with OCTGN
        shell: pwsh
        run: |
          $builder = Resolve-Path 'octgn-src/octgnFX/o8build/bin/Release/o8build.exe'
          $definition = (Resolve-Path 'dist').Path
          & $builder -d $definition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-ChildItem dist/*.nupkg | Select-Object -First 1
          if (-not $package) { throw 'OCTGN did not produce a package.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $package.FullName artifacts/Epic-Battles-Online-0.8.0.0.o8g

      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Resolve-Path 'artifacts/Epic-Battles-Online-0.8.0.0.o8g'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entries = @($zip.Entries.FullName)
            if ('def/definition.xml' -notin $entries) { throw 'Missing definition.xml' }
            $sets = @($entries | Where-Object { $_ -match '^def/Sets/.+/set\.xml$' })
            if ($sets.Count -ne 7) { throw "Expected Marvel Vs Capcom, Street Fighter 2, Mortal Kombat Round 1, Mortal Kombat Premiere, Street Fighter, Tekken, and Tekken Promos; found $($sets.Count) sets." }
            if ('def/Resources/Cardback.jpg' -notin $entries) { throw 'Missing Cardback.jpg' }
            if ('def/Plugins/EpicBattlesImageDownloader/EpicBattlesImageDownloader.dll' -notin $entries) { throw 'Missing image downloader plugin.' }
          }
          finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: Epic-Battles-Online-0.8.0.0
          path: artifacts/Epic-Battles-Online-0.8.0.0.o8g
          if-no-files-found: error
